# Genera los exe en Windows con build.ps1, el mismo script que se usa a mano.
#
# - Al publicar una release en GitHub, adjunta los dos exe y build-info.txt.
# - A mano (Actions > build > Run workflow), deja los exe como artefacto.
# - En los PR que tocan el build, lo corre para confirmar que sigue andando.
name: build

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - build.ps1
      - "*.spec"
      - tools/build_meta.py
      - pyproject.toml
      - poetry.lock
      - .github/workflows/build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # git describe necesita los tags para la versión

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build
        shell: powershell
        run: .\build.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: berry-exes
          path: |
            dist/berry-monitor.exe
            dist/berry-configure.exe
            dist/build-info.txt

  adjuntar:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: berry-exes

      - name: Adjuntar a la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ github.event.release.tag_name }}"
          berry-monitor.exe berry-configure.exe build-info.txt
          --clobber --repo "${{ github.repository }}"
