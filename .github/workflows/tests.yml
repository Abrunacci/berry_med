# Corre los tests en cada PR y en cada push a main. Es el chequeo "tests"
# que la regla de protección de main exige para mergear.
#
# Los tests no necesitan el Berry: el parser se prueba con tramas sintéticas y
# con las capturas grabadas en tests/capturas (ver development.md, "Tests").
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # La misma versión de Python con la que se generan los exe.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Fijo en la versión con la que se generó poetry.lock.
      - name: Instalar Poetry
        run: python -m pip install poetry==2.4.1

      - name: Instalar dependencias
        run: poetry install --no-interaction

      - name: Tests
        run: poetry run pytest
